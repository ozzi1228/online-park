# 로컬 개발용 DB. 실행: docker compose up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped   # PC·Docker를 다시 켜도 DB가 저절로 켜짐
    environment:
      POSTGRES_USER: sakura
      POSTGRES_PASSWORD: sakura
      POSTGRES_DB: sakura
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
