#cloud-config
# First boot on the Azure VM: install Docker, add 2GB swap (VM has 1GB RAM, builds need it), git.
# Keep this file ASCII-only: the Windows Azure CLI reads it with the system codepage.
package_update: true
packages: [docker.io, docker-compose-v2, git]
runcmd:
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - usermod -aG docker sakura
  - systemctl enable --now docker
