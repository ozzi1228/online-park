<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>벚꽃 놀이 시안</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe8f7;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  canvas{display:block;touch-action:none}
  #ui{position:fixed;left:16px;right:16px;top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
  #ui h1{margin:0 8px 0 0;font-size:15px;color:#7a4a56;background:#fff8f5cc;padding:8px 12px;border-radius:12px}
  #ui button{pointer-events:auto;border:0;border-radius:999px;padding:8px 14px;font-size:14px;background:#fff8f5;color:#7a4a56;box-shadow:0 2px 0 #e9b9c6;cursor:pointer}
  #ui button.on{background:#f7a8be;color:#fff;box-shadow:0 2px 0 #d9869e}
  .label{position:fixed;transform:translate(-50%,-100%);font-size:12px;color:#6b4450;background:#fff8f5d9;padding:2px 8px;border-radius:8px;white-space:nowrap;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="ui">
  <h1>사이버 벚꽃 놀이 · 시안 v2</h1>
  <button data-mode="idle" class="on">서 있기</button>
  <button data-mode="walk">걷기</button>
  <button data-mode="wish">소원 빌기</button>
  <button data-mode="sit">앉기</button>
  <button id="rot" class="on">자동 회전</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 기본 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{ // 하늘: 위 하늘색 → 아래 크림핑크
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#9fd2f2'); gr.addColorStop(0.6, '#d9ecf6'); gr.addColorStop(1, '#fbe3ea');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
scene.fog = new THREE.Fog(0xf7e3ea, 20, 60);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 3.2, 11);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 1.2);
controls.enableDamping = true;
controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
controls.minDistance = 3; controls.maxDistance = 14;
controls.maxPolarAngle = 1.45;
window.__view = { camera, controls }; // 디버그용

scene.add(new THREE.HemisphereLight(0xfff4ea, 0xc3b0e0, 1.3)); // 그림자 쪽을 보랏빛으로
const sun = new THREE.DirectionalLight(0xfff0dc, 2.2);
sun.position.set(6, 12, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 40 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun);

// ---------- 재질: 2단 툰 + 외곽선 ----------
const grad = new THREE.DataTexture(new Uint8Array([160, 160, 160, 255, 255, 255, 255, 255]), 2, 1);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const cache = new Map();
const toon = (c, extra = {}) => {
  const k = c + JSON.stringify(Object.keys(extra));
  if (!cache.has(k)) cache.set(k, new THREE.MeshToonMaterial({ color: c, gradientMap: grad, ...extra }));
  return cache.get(k);
};
const lineCache = new Map();
const lineMat = c => {
  if (!lineCache.has(c)) lineCache.set(c, new THREE.MeshBasicMaterial({ color: c, side: THREE.BackSide }));
  return lineCache.get(c);
};
const OUTLINE = '#5a3a30';
// 중심 정렬된 지오메트리를 살짝 키운 뒷면으로 외곽선 (두께 t 일정)
function part(geo, color, t = 0.018, oc = OUTLINE) {
  const m = new THREE.Mesh(geo, toon(color));
  m.castShadow = true; m.receiveShadow = true;
  if (t) {
    geo.computeBoundingBox();
    const s = geo.boundingBox.getSize(new THREE.Vector3());
    const o = new THREE.Mesh(geo, lineMat(oc));
    o.scale.set((s.x + 2 * t) / s.x, (s.y + 2 * t) / s.y, (s.z + 2 * t) / s.z);
    m.add(o);
  }
  return m;
}
const at = (m, x, y, z) => (m.position.set(x, y, z), m);
const sph = (r, sx = 1, sy = 1, sz = 1) => new THREE.SphereGeometry(r, 24, 16).scale(sx, sy, sz);
const cap = (r, l, sx = 1, sz = 1) => new THREE.CapsuleGeometry(r, l, 6, 14).scale(sx, 1, sz);

const dummy = new THREE.Object3D(), col = new THREE.Color();
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// ---------- 땅 ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), toon('#c6e5a9'));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const strip = (w, z, color, y) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(160, w), toon(color));
  m.rotation.x = -Math.PI / 2; m.position.set(0, y, z); m.receiveShadow = true; scene.add(m); return m;
};
strip(2.8, 1.2, '#f4e7d6', 0.006);          // 산책로
const river = strip(4.5, -8.5, '#a3d8ef', 0.008); // 강
strip(0.35, -6.1, '#e9dccb', 0.01);         // 강둑 턱

// ---------- 벚꽃나무 ----------
const PINKS = ['#f9c6d4', '#f4adc2', '#fbd8e1'];
const treeSpots = [];
function makeTree(x, z, s = 1) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); g.rotation.y = rand() * 6;
  // 줄기: 1.7m에서 갈라져 가지들이 꽃 속으로 사라짐 (끝이 가늘어 잘린 면이 안 보임)
  const BARK = '#7d5646';
  g.add(at(part(new THREE.CylinderGeometry(0.15, 0.22, 1.8, 10), BARK, 0.02), 0, 0.9, 0));
  const puffs = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + rand() * 0.6, tilt = 0.55 + rand() * 0.45, len = 1.5 + rand() * 0.5;
    const b = part(new THREE.CylinderGeometry(0.02, 0.1, len, 7, 1, true), BARK, 0.016);
    const dir = new THREE.Vector3(Math.cos(a) * Math.sin(tilt), Math.cos(tilt), Math.sin(a) * Math.sin(tilt));
    b.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    b.position.set(0, 1.65, 0).addScaledVector(dir, len / 2); g.add(b);
    // 가지 끝마다 꽃 무리 (보이지 않는 구 = 꽃송이 배치 영역)
    puffs.push([new THREE.Vector3(0, 1.65, 0).addScaledVector(dir, len * 0.95), 0.75 + rand() * 0.3]);
    puffs.push([new THREE.Vector3(0, 1.65, 0).addScaledVector(dir, len * 0.55).add(new THREE.Vector3(0, 0.3, 0)), 0.6 + rand() * 0.2]);
  }
  puffs.push([new THREE.Vector3(0, 3.1, 0), 0.9]);
  scene.add(g); treeSpots.push([x, z, s]);
  g.updateMatrixWorld(true);
  for (const [p, r] of puffs) blossomSpots.push({ c: g.localToWorld(p.clone()), r: r * s, top: 2.9 * s });
}
const blossomSpots = [];

// 꽃송이 카드 텍스처: 가운데 분홍 → 끝 흰색인 다섯 잎 꽃 여러 송이
function blossomTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  for (let i = 0; i < 22; i++) {
    const a = rand() * 6.28, d = Math.sqrt(rand()) * 92;
    const cx = 128 + Math.cos(a) * d, cy = 128 + Math.sin(a) * d, s = 16 + rand() * 14, rot = rand() * 6.28;
    const gr = x.createRadialGradient(cx, cy, 0, cx, cy, s * 1.2);
    gr.addColorStop(0, '#ff9fbb'); gr.addColorStop(0.45, '#ffe3eb'); gr.addColorStop(1, '#ffffff');
    x.fillStyle = gr;
    for (let k = 0; k < 5; k++) {
      const pa = rot + k * 1.2566;
      x.save(); x.translate(cx + Math.cos(pa) * s * 0.55, cy + Math.sin(pa) * s * 0.55); x.rotate(pa);
      x.beginPath(); x.ellipse(0, 0, s * 0.6, s * 0.42, 0, 0, 7); x.fill();
      x.fillStyle = '#ffffff'; x.globalCompositeOperation = 'destination-out'; // 잎 끝 홈
      x.beginPath(); x.arc(s * 0.62, 0, s * 0.1, 0, 7); x.fill();
      x.restore(); x.globalCompositeOperation = 'source-over'; x.fillStyle = gr;
    }
    x.fillStyle = '#e8628a'; x.beginPath(); x.arc(cx, cy, s * 0.13, 0, 7); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
for (const x of [-10, -4, 2.5, 8.5]) makeTree(x, -3.6, 1 + rand() * 0.15);
for (let x = -26; x <= 26; x += 4.3) makeTree(x + rand(), -12.5, 0.85 + rand() * 0.2); // 강 건너
for (const x of [-9, 0, 9]) makeTree(x, 19, 1);

{ // 나무 덩어리 표면에 꽃송이 카드를 촘촘히. 햇빛 방향으로 밝게, 아래·안쪽은 진하게 (가짜 조명)
  const sunDir = sun.position.clone().normalize();
  const cards = [];
  for (const b of blossomSpots) for (let i = Math.round(b.r * b.r * 220); i > 0; i--) cards.push(b);
  const tex = blossomTexture();
  const mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.4, side: THREE.DoubleSide }), cards.length);
  mesh.castShadow = true; // 꽃 모양 그대로 그림자
  mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.4 });
  const u = new THREE.Vector3(), dark = new THREE.Color('#d9819d'), light = new THREE.Color('#fff6f8');
  cards.forEach((b, i) => {
    u.randomDirection(); if (u.y < -0.5) u.y *= 0.4; u.normalize();
    const depth = 0.25 + Math.sqrt(Math.random()) * 0.8; // 바깥쪽에 많이, 안쪽도 채움
    dummy.position.copy(b.c).addScaledVector(u, b.r * depth);
    dummy.lookAt(dummy.position.clone().add(u));
    dummy.rotateZ(Math.random() * 6.28); dummy.rotateX((Math.random() - 0.5) * 1.2);
    dummy.scale.setScalar(b.r * (0.45 + Math.random() * 0.4));
    dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
    const l = THREE.MathUtils.clamp((u.dot(sunDir) * 0.5 + 0.5) * (0.4 + depth * 0.7) + (dummy.position.y - b.top) * 0.12, 0, 1);
    mesh.setColorAt(i, col.copy(dark).lerp(light, Math.pow(l, 0.8) * (0.85 + Math.random() * 0.15)));
  });
  scene.add(mesh);
}

// ---------- 벤치 ----------
{
  const b = new THREE.Group(); b.position.set(5.6, 0, -1.4);
  const wood = '#cf9f73';
  b.add(at(part(new THREE.BoxGeometry(1.5, 0.08, 0.42), wood), 0, 0.44, 0));
  b.add(at(part(new THREE.BoxGeometry(1.5, 0.3, 0.06), wood), 0, 0.72, -0.2));
  for (const sx of [-0.65, 0.65]) for (const sz of [-0.15, 0.15]) b.add(at(part(new THREE.BoxGeometry(0.07, 0.44, 0.07), '#8f6654'), sx, 0.22, sz));
  scene.add(b);
}

// ---------- 꽃잎 ----------
const petalShape = new THREE.Shape();
petalShape.moveTo(0, 0);
petalShape.bezierCurveTo(-0.06, 0.03, -0.07, 0.09, -0.03, 0.12);
petalShape.lineTo(0, 0.104); petalShape.lineTo(0.03, 0.12);
petalShape.bezierCurveTo(0.07, 0.09, 0.06, 0.03, 0, 0);
const petalGeo = new THREE.ShapeGeometry(petalShape).translate(0, -0.06, 0);
const petalMat = new THREE.MeshToonMaterial({ color: '#ffffff', gradientMap: grad, side: THREE.DoubleSide });

const GROUND_N = 3000;
const groundPetals = new THREE.InstancedMesh(petalGeo, petalMat, GROUND_N);
groundPetals.receiveShadow = true;
for (let i = 0; i < GROUND_N; i++) {
  const [tx, tz] = treeSpots[Math.floor(rand() * treeSpots.length)];
  const r = Math.abs((rand() + rand() + rand() - 1.5)) * 3.2, a = rand() * 6.28;
  dummy.position.set(tx + Math.cos(a) * r, 0.016, tz + Math.sin(a) * r);
  dummy.rotation.set(-Math.PI / 2, 0, rand() * 6.28); dummy.scale.setScalar(0.8 + rand() * 0.6);
  dummy.updateMatrix(); groundPetals.setMatrixAt(i, dummy.matrix);
  groundPetals.setColorAt(i, col.set(PINKS[i % 3]));
}
scene.add(groundPetals);

const FALL_N = 600;
const falling = new THREE.InstancedMesh(petalGeo, petalMat, FALL_N);
const fp = [];
const respawn = (p, anyY) => {
  const [tx, tz] = treeSpots[Math.floor(Math.random() * 4)]; // 가까운 나무들 위주
  p.x = tx + (Math.random() - 0.5) * 8; p.z = tz + (Math.random() - 0.3) * 9;
  p.y = anyY ? Math.random() * 4 : 3 + Math.random() * 1.5;
  p.v = 0.35 + Math.random() * 0.35; p.ph = Math.random() * 6.28; p.sp = 1 + Math.random() * 2;
};
for (let i = 0; i < FALL_N; i++) { const p = {}; respawn(p, true); fp.push(p); falling.setColorAt(i, col.set(PINKS[i % 3])); }
scene.add(falling);

// ---------- 캐릭터 ----------
function faceTexture(p, closed) {
  // 256x192 = 머리 앞면 장식 구간 비율에 맞춤
  const c = document.createElement('canvas'); c.width = 256; c.height = 192;
  const x = c.getContext('2d'); x.lineCap = 'round';
  const ec = p.eye || '#3b2a24';
  x.fillStyle = 'rgba(247,140,165,0.5)';
  for (const s of [-1, 1]) { x.beginPath(); x.ellipse(128 + s * 74, 102, 19, 10, 0, 0, 7); x.fill(); }
  for (const s of [-1, 1]) {
    const ex = 128 + s * 48, ey = 76;
    x.strokeStyle = ec; x.fillStyle = ec; x.lineWidth = 6;
    if (closed) { x.beginPath(); x.arc(ex, ey - 6, 12, 0.15 * Math.PI, 0.85 * Math.PI); x.stroke(); }
    else if (p.smile) { x.beginPath(); x.arc(ex, ey + 6, 12, 1.15 * Math.PI, 1.85 * Math.PI); x.stroke(); }
    else {
      x.beginPath(); x.ellipse(ex, ey, 10, 14, 0, 0, 7); x.fill();
      x.fillStyle = '#fff'; x.beginPath(); x.arc(ex + 3, ey - 5, 3.5, 0, 7); x.fill();
    }
    x.strokeStyle = p.brow || '#5a3a30'; x.lineWidth = 5;
    x.beginPath(); x.moveTo(ex - 11, 42); x.quadraticCurveTo(ex, 36, ex + 11, 42); x.stroke();
    if (p.glasses) { x.strokeStyle = '#6b4a3a'; x.lineWidth = 4; x.beginPath(); x.arc(ex, ey, 23, 0, 7); x.stroke(); }
  }
  if (p.glasses) { x.beginPath(); x.moveTo(105, 74); x.lineTo(151, 74); x.stroke(); }
  x.strokeStyle = '#8a4a42'; x.lineWidth = 5;
  x.beginPath(); x.arc(128, 116, 9, 0.2 * Math.PI, 0.8 * Math.PI); x.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}

function makeChar(p) {
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  const H = 0.98; // 목 높이
  const bt = p.bottomType || 'pants', tt = p.topType || 'tee';
  const add = (geo, color, x, y, z, parent = body) => { const m = at(part(geo, color), x, y, z); parent.add(m); return m; };
  // 하체
  const bareLegs = bt === 'skirt' || bt === 'longskirt' || bt === 'shorts';
  const legs = [-1, 1].map(s => {
    const g = new THREE.Group(); g.position.set(s * 0.1, 0.46, 0);
    add(bt === 'wide' ? cap(0.11, 0.18) : cap(0.085, 0.2), bareLegs ? p.skin : p.bottom, 0, -0.18, 0, g);
    if (bt === 'shorts') add(cap(0.097, 0.05), p.bottom, 0, -0.03, 0, g);
    add(sph(0.1, 1, 0.62, 1.4), p.shoes, 0, -0.4, 0.04, g);
    body.add(g); return g;
  });
  add(cap(0.2, 0.18, 1, 0.9), p.top, 0, 0.72, 0);
  if (bt === 'skirt') add(new THREE.CylinderGeometry(0.19, 0.3, 0.26, 18), p.bottom, 0, 0.5, 0);
  else if (bt === 'longskirt') add(new THREE.CylinderGeometry(0.2, 0.34, 0.44, 18), p.bottom, 0, 0.36, 0);
  else add(sph(0.2, 1, 0.55, 0.9), p.bottom, 0, 0.5, 0);
  // 상의 디테일
  if (tt === 'hoodie') { add(sph(0.2, 1.25, 0.7, 0.9), p.top, 0, 1.0, -0.2); add(new THREE.BoxGeometry(0.2, 0.08, 0.03), p.top, 0, 0.6, 0.175); }
  if (tt === 'jacket') {
    add(new THREE.BoxGeometry(0.1, 0.42, 0.04), p.inner || '#ffffff', 0, 0.72, 0.17);
    if (p.tie) add(new THREE.BoxGeometry(0.035, 0.2, 0.03), p.tie, 0, 0.76, 0.193);
  }
  if (tt === 'overalls') {
    add(new THREE.BoxGeometry(0.22, 0.2, 0.04), p.bottom, 0, 0.66, 0.175);
    for (const s of [-1, 1]) add(new THREE.BoxGeometry(0.04, 0.26, 0.03), p.bottom, s * 0.08, 0.86, 0.165);
  }
  if (p.collar) { const c = add(new THREE.TorusGeometry(0.15, 0.035, 8, 20), p.collar, 0, 0.98, 0.01); c.rotation.x = Math.PI / 2; }
  if (p.scarf) { const c = add(new THREE.TorusGeometry(0.16, 0.065, 8, 20), p.scarf, 0, 0.97, 0); c.rotation.x = Math.PI / 2; }
  if (p.bag) {
    add(new THREE.BoxGeometry(0.15, 0.13, 0.06), p.bag, 0.21, 0.52, 0.1);
    const st = add(new THREE.CylinderGeometry(0.012, 0.012, 0.62, 6), p.bag, 0.02, 0.78, 0.185); st.rotation.z = 0.75;
  }
  const arms = [-1, 1].map(s => {
    const g = new THREE.Group(); g.position.set(s * 0.25, 0.92, 0);
    add(cap(0.065, 0.2), p.top, 0, -0.16, 0, g);
    add(sph(0.07), p.skin, 0, -0.33, 0, g);
    body.add(g); return g;
  });
  // 머리
  const head = new THREE.Group(); head.position.y = H; body.add(head);
  const hy = y => y - H;
  head.add(at(part(sph(0.34), p.skin), 0, hy(1.3), 0));
  for (const s of [-1, 1]) head.add(at(part(sph(0.07, 0.6, 1, 1), p.skin), s * 0.335, hy(1.27), 0));
  const texOpen = faceTexture(p, false), texClosed = faceTexture(p, true);
  const faceMat = new THREE.MeshToonMaterial({ map: texOpen, gradientMap: grad, transparent: true, depthWrite: false });
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.343, 32, 16, Math.PI / 2 - 0.8, 1.6, 0.4 * Math.PI, 0.38 * Math.PI), faceMat);
  face.position.y = hy(1.3); face.renderOrder = 2; head.add(face);
  const hc = p.hair, hairAt = (geo, x, y, z, c = hc) => { const m = at(part(geo, c), x, hy(y), z); head.add(m); return m; };
  if (p.style === 'bald') {
    hairAt(sph(0.355), 0, 1.27, -0.08);
  } else {
    hairAt(sph(0.36), 0, 1.34, -0.03);
    const noBangs = p.bangs === 'none' || p.style === 'slick' || p.style === 'manbun';
    const bangs = p.bangs === 'side' ? [[-0.15, 0.6], [0.06, 1], [0.2, 0.7]] : [[-0.15, 1], [0, 1], [0.15, 1]];
    if (!noBangs) for (const [bx, k] of bangs) {
      const b = part(sph(0.13, 1, 0.62 * k + 0.2, 0.55), hc);
      b.position.set(bx, hy(1.47), 0.27 - Math.abs(bx) * 0.25); b.rotation.y = bx * 1.6; b.rotation.x = -0.35;
      head.add(b);
    }
  }
  if (p.style === 'long' || p.style === 'wavy') {
    hairAt(cap(0.2, 0.32, 1.55, 0.55), 0, 1.13, -0.2);
    for (const s of [-1, 1]) hairAt(cap(0.075, 0.3), s * 0.3, 1.13, 0.06);
  }
  if (p.style === 'wavy') {
    for (const [x, y, z] of [[-0.2, 0.95, -0.2], [0, 0.93, -0.24], [0.2, 0.95, -0.2], [-0.31, 0.95, 0.06], [0.31, 0.95, 0.06]]) hairAt(sph(0.1), x, y, z);
  }
  if (p.style === 'bob') {
    for (const s of [-1, 1]) hairAt(sph(0.15, 1, 1.6, 1.35), s * 0.27, 1.2, -0.02);
    hairAt(sph(0.3, 1, 0.75, 0.6), 0, 1.18, -0.2);
  }
  if (p.style === 'buns') for (const s of [-1, 1]) hairAt(sph(0.12), s * 0.21, 1.62, -0.06);
  if (p.style === 'pony') { hairAt(sph(0.1), 0, 1.45, -0.36); hairAt(cap(0.085, 0.22), 0, 1.24, -0.42); }
  if (p.style === 'twotail') for (const s of [-1, 1]) { hairAt(sph(0.08), s * 0.3, 1.36, -0.16); hairAt(cap(0.075, 0.22), s * 0.34, 1.13, -0.14); }
  if (p.style === 'manbun') hairAt(sph(0.12), 0, 1.66, -0.14);
  if (p.style === 'braid') for (let i = 0; i < 4; i++) hairAt(sph(0.075 - i * 0.008), 0.29, 1.17 - i * 0.11, 0.1);
  if (p.style === 'curly') for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2;
    hairAt(sph(0.11), Math.cos(a) * 0.24, 1.55 + Math.sin(i * 2.3) * 0.05, Math.sin(a) * 0.24 - 0.04);
  }
  // 모자·장식
  if (p.hat === 'beanie') { hairAt(sph(0.38, 1, 0.72, 1), 0, 1.5, -0.02, p.hatColor); hairAt(new THREE.CylinderGeometry(0.375, 0.375, 0.08, 28), 0, 1.42, -0.02, p.hatColor); hairAt(sph(0.07), 0, 1.79, -0.02, p.hatColor); }
  if (p.hat === 'cap') { hairAt(sph(0.375, 1, 0.66, 1), 0, 1.5, -0.02, p.hatColor); hairAt(sph(0.2, 1.1, 0.1, 1), 0, 1.44, 0.36, p.hatColor); }
  if (p.hat === 'bucket') { hairAt(sph(0.365, 1, 0.66, 1), 0, 1.52, -0.02, p.hatColor); hairAt(new THREE.CylinderGeometry(0.46, 0.5, 0.035, 28), 0, 1.42, -0.02, p.hatColor); }
  if (p.hat === 'beret') { const b = hairAt(sph(0.37, 1.05, 0.38, 1.05), 0.03, 1.62, -0.02, p.hatColor); b.rotation.z = -0.22; }
  if (p.ribbon) for (const s of [-1, 1]) hairAt(sph(0.06, 1, 0.8, 0.7), 0.24 + s * 0.07, 1.6, 0.06, p.ribbon);
  if (p.kid) { root.scale.setScalar(0.76); head.scale.setScalar(1.12); }
  return { root, body, head, arms, legs, faceMat, texOpen, texClosed, ph: Math.random() * 6, blinkAt: 1 + Math.random() * 3 };
}

const chars = PRESETS.map((p, i) => {
  const c = makeChar(p);
  const row = i % 2, col = Math.floor(i / 2); // 두 줄, 엇갈리게
  c.root.position.set((col - 4.5) * 1.05 + row * 0.5, 0, row ? 0.4 : 2.0);
  scene.add(c.root);
  const el = document.createElement('div'); el.className = 'label'; el.textContent = p.name; document.body.appendChild(el);
  c.el = el; c.top = (p.kid ? 1.55 : 1.85) + (p.hat ? 0.12 : 0);
  return c;
});

// ---------- UI ----------
let mode = 'idle';
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b));
});
const rotBtn = document.getElementById('rot');
rotBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; rotBtn.classList.toggle('on', controls.autoRotate); };
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

// ---------- 루프 ----------
const clock = new THREE.Clock(), v = new THREE.Vector3();
const ease = (obj, key, target, k) => { obj[key] += (target - obj[key]) * k; };
function animateChar(c, t, dt) {
  const k = 1 - Math.exp(-dt * 14);
  const w = t * 7 + c.ph, s = Math.sin(w);
  let legX = 0, armX = 0, armZ = 0.1, bodyY = Math.sin(t * 2 + c.ph) * 0.012, headX = 0, closed = false;
  if (mode === 'walk') { legX = 0.55 * s; armX = -0.5 * s; armZ = 0.12; bodyY = Math.abs(s) * 0.045; }
  if (mode === 'wish') { armX = -1.25; armZ = -0.62; headX = 0.2; closed = true; }
  if (mode === 'sit') { legX = -1.45; armX = -0.35; armZ = 0.15; bodyY = -0.3; }
  ease(c.legs[0].rotation, 'x', mode === 'sit' ? legX : legX, k);
  ease(c.legs[1].rotation, 'x', mode === 'sit' ? legX : -legX, k);
  ease(c.arms[0].rotation, 'x', mode === 'walk' ? -armX : armX, k);
  ease(c.arms[1].rotation, 'x', armX, k);
  ease(c.arms[0].rotation, 'z', -armZ, k);
  ease(c.arms[1].rotation, 'z', armZ, k);
  ease(c.body.position, 'y', bodyY, k);
  ease(c.head.rotation, 'x', headX, k);
  if (t > c.blinkAt) { if (t > c.blinkAt + 0.13) c.blinkAt = t + 2 + Math.random() * 3; else closed = true; }
  const tex = closed ? c.texClosed : c.texOpen;
  if (c.faceMat.map !== tex) { c.faceMat.map = tex; }
  // 이름표
  v.set(c.root.position.x, c.top, c.root.position.z).project(camera);
  c.el.style.display = v.z < 1 ? '' : 'none';
  c.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
  c.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const wind = 0.4 + Math.max(0, Math.sin(t * 0.25)) ** 4 * 1.6; // 가끔 바람이 셈
  for (let i = 0; i < FALL_N; i++) {
    const p = fp[i];
    p.y -= p.v * dt;
    p.x += (Math.sin(t * p.sp + p.ph) * 0.35 + wind) * dt;
    p.z += Math.cos(t * p.sp * 0.7 + p.ph) * 0.2 * dt;
    if (p.y < 0.02 || p.x > 16) respawn(p, false);
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(t * p.sp + p.ph, t * 0.7 + p.ph, Math.sin(t * p.sp) * 0.8);
    dummy.scale.setScalar(1);
    dummy.updateMatrix(); falling.setMatrixAt(i, dummy.matrix);
  }
  falling.instanceMatrix.needsUpdate = true;
  river.material.color.setHSL(0.55, 0.62, 0.79 + Math.sin(t * 1.3) * 0.01);
  for (const c of chars) animateChar(c, t, dt);
  controls.update();
  renderer.render(scene, camera);
});
